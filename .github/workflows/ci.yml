name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxcb1-dev \
            libfontconfig1-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace

  engines:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install engine deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config gettext \
            libibus-1.0-dev libxkbcommon-dev libxcb1-dev \
            libfontconfig1-dev libudev-dev \
            fcitx5-modules-dev libfcitx5core-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build libuvie FFI
        run: cargo build --release -p uvie-ffi
      - name: Build ibus-uvie
        run: |
          cmake -S ibus -B build-ibus -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ibus
      - name: Build fcitx5-uvie
        run: |
          cmake -S fcitx5 -B build-fcitx5 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-fcitx5
      - uses: actions/upload-artifact@v4
        with:
          name: uvie-linux
          path: |
            target/release/uvie-inputd
            target/release/uvie-ui
            target/release/libuvie_ffi.so
            build-ibus/ibus-engine-uvie
            build-ibus/uvie.xml
            build-fcitx5/libuvie.so
            build-fcitx5/src/uvie.conf
            build-fcitx5/src/uvie-addon.conf
