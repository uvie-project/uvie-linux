name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config gettext \
            libibus-1.0-dev libxkbcommon-dev libxcb1-dev \
            libfontconfig1-dev libudev-dev \
            fcitx5-modules-dev libfcitx5core-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: Build ibus-uvie
        run: |
          cmake -S ibus -B build-ibus -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ibus
      - name: Build fcitx5-uvie
        run: |
          cmake -S fcitx5 -B build-fcitx5 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-fcitx5
      - name: Stage package
        run: |
          pkg=uvie-for-linux-x86_64
          mkdir -p "$pkg/bin" "$pkg/lib/ibus" "$pkg/share/ibus/component" \
                   "$pkg/lib/fcitx5" "$pkg/etc/fcitx5/addon" "$pkg/etc/fcitx5/conf.d" \
                   "$pkg/share/icons/hicolor/256x256/apps" \
                   "$pkg/share/applications" "$pkg/lib/systemd/user" "$pkg/lib/udev/rules.d"
          cp target/release/uvie-inputd "$pkg/bin/"
          cp target/release/uvie-ui "$pkg/bin/"
          cp target/release/libuvie_ffi.so "$pkg/lib/"
          cp build-ibus/ibus-engine-uvie "$pkg/lib/ibus/"
          cp build-ibus/uvie.xml "$pkg/share/ibus/component/"
          cp build-fcitx5/src/libuvie.so "$pkg/lib/fcitx5/"
          cp build-fcitx5/src/uvie-addon.conf "$pkg/etc/fcitx5/addon/"
          cp build-fcitx5/src/uvie.conf "$pkg/etc/fcitx5/conf.d/"
          cp assets/logo.png "$pkg/share/icons/hicolor/256x256/apps/uvie.png"
          cp packaging/uvie-ui.desktop "$pkg/share/applications/"
          cp packaging/uvie-inputd.service "$pkg/lib/systemd/user/"
          cp packaging/99-uvie.rules "$pkg/lib/udev/rules.d/"
          cp packaging/install-prebuilt.sh "$pkg/install.sh"
          chmod +x "$pkg/install.sh"
          cp README.md "$pkg/"
          tar -czf "$pkg.tar.gz" "$pkg"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: UVie for Linux ${{ github.ref_name }}
          files: uvie-for-linux-x86_64.tar.gz
          generate_release_notes: true

  # Build .debs and publish the signed apt repo to the gh-pages branch
  # (served at https://uvie-project.github.io/uvie-linux).
  apt-repo:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-debs.sh needs tags for the version
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config gettext reprepro \
            libibus-1.0-dev libxkbcommon-dev libxcb1-dev \
            libfontconfig1-dev libudev-dev \
            fcitx5-modules-dev libfcitx5core-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build all
        run: |
          cargo build --release --workspace
          cmake -S ibus -B build-ibus -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ibus
          cmake -S fcitx5 -B build-fcitx5 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-fcitx5
      - name: Build debs
        run: packaging/build-debs.sh "${{ github.ref_name }}"
      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish apt repo
        env:
          APT_GPG_KEYID: ${{ secrets.APT_GPG_KEYID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add apt-repo origin/gh-pages
          packaging/publish-apt.sh apt-repo "$APT_GPG_KEYID" dist/debs/*.deb
          cd apt-repo
          git add -A
          git commit -m "apt: publish ${{ github.ref_name }}" || true
          git push origin HEAD:gh-pages
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: UVie for Linux ${{ github.ref_name }}
          files: dist/debs/*.deb
